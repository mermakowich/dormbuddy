services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dormbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dormbuddy
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dormbuddy-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormbuddy -d dormbuddy"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  dormbuddy-data:
