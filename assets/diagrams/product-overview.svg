<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>DormBuddy: две независимые ленты и контекстный помощник</title><rect width="1120" height="430" fill="#f6f8fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202b3d} .h{font-weight:700} .muted{fill:#5d6b7f}</style><text x="36" y="48" font-size="29" class="h">Один переезд — несколько связанных задач</text><text x="36" y="82" font-size="17" class="muted">Москва · общежитие или аренда · концепция для обсуждения</text><rect x="36" y="111" width="510" height="170" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="58" y="147" font-size="22" class="h">Соседи</text><text x="58" y="179" font-size="16" class="muted">Анкета → объяснимая совместимость</text><text x="58" y="205" font-size="16" class="muted">Like / Skip → взаимное совпадение</text><text x="58" y="231" font-size="16" class="muted">Режим общежития или совместной аренды</text><rect x="574" y="111" width="510" height="170" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="596" y="147" font-size="22" class="h">Жильё</text><text x="596" y="179" font-size="16" class="muted">Отдельная лента квартир и комнат</text><text x="596" y="205" font-size="16" class="muted">Фильтры → избранное</text><text x="596" y="231" font-size="16" class="muted">Общие варианты после mutual match</text><rect x="36" y="307" width="1048" height="93" rx="16" fill="#eaf0ff" stroke="#d5ddea"/><text x="58" y="343" font-size="22" class="h">AI Buddy</text><text x="58" y="375" font-size="16" class="muted">Диалог с учётом вуза, района, бюджета и этапа переезда</text></svg>