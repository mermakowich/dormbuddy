<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img"><title>Предлагаемая архитектура модульного монолита</title><rect width="1120" height="650" fill="#f6f8fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202b3d} .h{font-weight:700} .muted{fill:#5d6b7f}</style><text x="36" y="48" font-size="29" class="h">Архитектура: модульный монолит</text><rect x="36" y="86" width="1048" height="95" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="58" y="122" font-size="22" class="h">Веб-интерфейс</text><text x="58" y="154" font-size="16" class="muted">Анкета · соседи · жильё · общежитие · Buddy</text><text x="530" y="211" font-size="18" class="">↓ API</text><rect x="36" y="228" width="1048" height="198" rx="16" fill="#eaf0ff" stroke="#cbd6ed"/><text x="58" y="264" font-size="23" class="h">Python / FastAPI</text><rect x="58" y="285" width="492" height="114" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="80" y="321" font-size="22" class="h">Основные модули</text><text x="80" y="353" font-size="16" class="muted">Auth · Profiles · Matching</text><text x="80" y="379" font-size="16" class="muted">Swipes &amp; Matches · Housing · Dormitories</text><rect x="572" y="285" width="490" height="114" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="594" y="321" font-size="22" class="h">Buddy</text><text x="594" y="353" font-size="16" class="muted">Контекст и история диалога</text><text x="594" y="379" font-size="16" class="muted">Внешний вызов LLM только с сервера</text><text x="240" y="461" font-size="18" class="">↓ SQLAlchemy</text><text x="760" y="461" font-size="18" class="">↓ LLM API</text><rect x="36" y="482" width="510" height="125" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="58" y="518" font-size="22" class="h">PostgreSQL</text><text x="58" y="550" font-size="16" class="muted">Профили, анкеты, действия, объявления,</text><text x="58" y="576" font-size="16" class="muted">избранное и сообщения</text><rect x="574" y="482" width="510" height="125" rx="16" fill="#ffffff" stroke="#d5ddea"/><text x="596" y="518" font-size="22" class="h">Внешний провайдер LLM</text><text x="596" y="550" font-size="16" class="muted">Ошибка провайдера не блокирует</text><text x="596" y="576" font-size="16" class="muted">подбор соседей и ленты</text></svg>